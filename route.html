<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行き方を探す</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 30px 20px;
      background: #f7f7f7;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 35px;
    }

    .step {
      background: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .step-number {
      font-size: 14px;
      font-weight: bold;
      color: #777;
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 0;
    }

    select {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    .route-button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: #333;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .route-button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📍 行き方を探す</h1>

  <!-- ① 現在位置 -->
  <div class="step">

    <div class="step-number">STEP 1</div>

    <h2>現在位置</h2>

    <select id="start">
      <option value="">現在位置を選択してください</option>

      <option value="entrance">9号館入口</option>

      <option value="9-b1">出張千輝祭ラジオ</option>
      <option value="9-b1">千輝祭ミュージックフェス</option>
      <option value="9-b1">学部対抗クイズ</option>
      <option value="9-b1">世代を超える！イントロドン</option>
      <option value="9-b1">ビンゴ大会</option>
      <option value="9-b1">男女トイレ</option>
      <option value="9-1">コミットプレイス</option>
      <option value="9-2">休憩コーナー</option>
      <option value="9-2">保育児童学部の魅力を留学生が描いてみた</option>
      <option value="9-3">出張！心理学入門</option>
      <option value="9-3">入学相談</option>
       <option value="9-3">つくってあそぼ♪クレーンゲーム</option>
       <option value="9-3">手作り遊び広場</option>
       <option value="9-3">出張！王子キャンパス好事研究サークル</option>
       <option value="9-4">麦の家〜僕らか描いたもの〜</option>
      <option value="9-4">ココロ･クエスト〜命の木を育てよう〜</option>
      <option value="9-5">手縫いでチャレンジ！簡単お手玉講座</option>
      <option value="9-5">わらべうた遊び講座</option>

      <option value="8-1">8号館入口</option>
      <option value="8-1">nico letterコーヒーと豆販売</option>
      <option value="">9号館 2階</option>
      <option value="9-3">9号館 3階</option>
      <option value="9-4">9号館 4階</option>
      <option value="9-5">9号館 5階</option>
    </select>

  </div>


  <!-- ② 行きたい企画 -->
  <div class="step">

    <div class="step-number">STEP 2</div>

    <h2>行きたい企画</h2>

    <select id="destination">

      <option value="">企画を選択してください</option>

      <option value="901">901教室</option>
      <option value="902">902教室</option>
      <option value="903">903教室</option>

      <option value="931">931教室</option>
      <option value="932">932教室</option>
      <option value="933">933教室</option>
      <option value="934">934教室</option>

      <option value="941">941教室</option>
      <option value="942">942教室</option>

      <option value="951">951教室</option>
      <option value="952">952教室</option>
      <option value="953">953教室</option>
      <option value="954">954教室</option>

    </select>

  </div>


  <!-- ③ -->
  <button class="route-button" onclick="showRoute()">
    ここまでの行き方を見る
  </button>

</div>


<script>

function showRoute() {

  const start = document.getElementById("start").value;
  const destination = document.getElementById("destination").value;

  if (start === "" || destination === "") {
    alert("現在位置と行きたい企画を選択してください！");
    return;
  }

  alert("ルートを表示する準備中です！");
}

</script>

</body>
</html>
